<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc"><title id="title">文字保留，不等于关系保留</title><desc id="desc">虚构示意：原表中 A 项目预算为 80，B 项目预算为 20。丢失行列对应后，即使四个值仍在，也不能确保正确解释。</desc><rect width="760" height="470" rx="14" fill="#edf2ec"/><g font-family="sans-serif" fill="#24352b"><text x="32" y="50" font-size="26" font-weight="700">文字保留 ≠ 关系保留</text><text x="32" y="82" font-size="16">本站风险示意 · 虚构数据 · 不是实际转换输出</text><rect x="32" y="115" width="330" height="200" rx="8" fill="white"/><text x="52" y="150" font-size="20" font-weight="700">原始资料</text><text x="65" y="193" font-size="20">项目</text><text x="220" y="193" font-size="20">预算</text><path d="M52 208h288" stroke="#dce3db"/><text x="65" y="245" font-size="22">A</text><text x="220" y="245" font-size="22">80</text><text x="65" y="287" font-size="22">B</text><text x="220" y="287" font-size="22">20</text><rect x="390" y="115" width="338" height="200" rx="8" fill="white"/><text x="410" y="150" font-size="20" font-weight="700">假设关系在转换中丢失</text><text x="420" y="214" font-size="24">A　B　20　80</text><text x="410" y="263" font-size="18" fill="#8a551c">词和数字都在，但配对不再明确。</text><rect x="32" y="345" width="696" height="89" rx="8" fill="#245c4a"/><text x="52" y="382" font-size="21" fill="white">错误验收：只检查 A、B、20、80 有没有出现。</text><text x="52" y="415" font-size="21" fill="white">正确验收：确认每个数仍对应正确项目、单位与条件。</text></g></svg>
